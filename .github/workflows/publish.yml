name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The running deployment finishes; queued runs cannot overwrite newer source.
concurrency:
  group: mandarin-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:smoke
      - name: Package checked static output
        run: |
          touch dist/.nojekyll
          tar -czf site.tar.gz -C dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ github.sha }}
          path: site.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-${{ github.sha }}
          path: artifact
      - name: Unpack static output
        run: |
          mkdir -p dist
          tar -xzf artifact/site.tar.gz -C dist
          test -f dist/index.html
          test -f dist/.nojekyll
      - name: Check that source is still current
        id: fresh
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "Newer source exists ($current); skipping obsolete build $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish dist to gh-pages
        if: steps.fresh.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: ./dist
          enable_jekyll: false
          keep_files: false
          commit_message: 'Publish Mandarin'
      - name: Request Pages build and wait for this deployment
        if: steps.fresh.outputs.publish == 'true'
        run: |
          settings=$(gh api "repos/$GITHUB_REPOSITORY/pages") || {
            echo '::error::Enable Settings → Pages → Deploy from a branch → gh-pages → / (root), then run Publish again.'
            exit 1
          }
          if ! jq -e '.source.branch == "gh-pages" and .source.path == "/"' <<< "$settings" > /dev/null; then
            echo '::error::Pages must use gh-pages and / (root).'
            exit 1
          fi
          expected=$(gh api "repos/$GITHUB_REPOSITORY/branches/gh-pages" --jq '.commit.sha')
          # Push with GITHUB_TOKEN does not itself trigger branch Pages builds.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null
          for attempt in $(seq 1 60); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest")
            commit=$(jq -r '.commit' <<< "$result")
            status=$(jq -r '.status' <<< "$result")
            if [ "$commit" = "$expected" ] && [ "$status" = 'built' ]; then
              echo "Pages built gh-pages commit $expected." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$commit" = "$expected" ] && [ "$status" = 'errored' ]; then
              jq -r '.error.message' <<< "$result"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for Pages commit $expected. Inspect Pages build and deployment logs."
          exit 1
      - name: Verify live routes and missing-page response
        if: steps.fresh.outputs.publish == 'true'
        run: |
          site='https://itbert.github.io/Mandarin'
          for path in / /preparation/ /analysis/ /linear-algebra/ /about/ /license/ /sitemap-index.xml /pagefind/pagefind.js; do
            curl --fail --silent --show-error --retry 5 --retry-delay 10 "$site$path" -o /dev/null
          done
          code=$(curl --silent --show-error --retry 5 --retry-delay 10 -o /tmp/mandarin-404.html -w '%{http_code}' "$site/not-a-real-page/")
          test "$code" = 404
          echo '[Mandarin is live](https://itbert.github.io/Mandarin/). Check search, themes and mobile navigation in a browser.' >> "$GITHUB_STEP_SUMMARY"
